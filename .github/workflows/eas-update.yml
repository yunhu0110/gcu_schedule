name: EAS Update (OTA)

# main에 push되면 JS/이미지/설정 변경을 preview 채널로 OTA 배포한다.
# ⚠️ 활성화 조건 (M0-5에서 충족):
#   1. `eas init`로 EAS 프로젝트 연결 + eas.json 존재
#   2. GitHub 저장소 Secrets에 EXPO_TOKEN 등록 (expo.dev > Access tokens에서 발급)
# EXPO_TOKEN이 없으면 아래 가드로 모든 실제 단계를 스킵하고 초록(성공)으로 끝난다.
# → 앱 파일을 push해도 토큰 설정 전까지는 CI가 빨갛게 실패하지 않는다.
#
# 네이티브 변경(라이브러리 추가·SDK 업그레이드·권한/아이콘 변경)은 OTA로 안 되므로
# 이 워크플로가 아니라 `eas build`(수동)로 새 빌드를 올려야 한다. 06-DEPLOYMENT.md 참조.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.js'
      - 'app.config.ts'
      - 'eas.json'
  workflow_dispatch: # 수동 실행도 허용

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Guard - EXPO_TOKEN 미설정 시 스킵
        if: ${{ env.EXPO_TOKEN == '' }}
        run: echo "::notice::EXPO_TOKEN이 없어 OTA 배포를 스킵합니다 (M0-5에서 활성화)."

      - name: Checkout
        if: ${{ env.EXPO_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ env.EXPO_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        if: ${{ env.EXPO_TOKEN != '' }}
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Install dependencies
        if: ${{ env.EXPO_TOKEN != '' }}
        run: npm ci

      - name: Publish OTA update (preview channel)
        if: ${{ env.EXPO_TOKEN != '' }}
        env:
          # 커밋 메시지를 셸 명령에 직접 끼워넣으면 따옴표/줄바꿈/특수문자로 파싱이 깨진다.
          # env 변수로 받아 첫 줄만 안전하게 --message 로 넘긴다.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          MSG=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          [ -z "$MSG" ] && MSG="manual update"
          # --environment preview: CI엔 .env가 없으므로 EAS 서버의 preview 환경변수(SUPABASE URL/KEY)를 주입
          eas update --branch preview --environment preview --message "$MSG" --non-interactive
