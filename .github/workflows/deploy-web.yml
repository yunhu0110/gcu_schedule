name: Deploy Web (PWA)

# 아이폰 멤버 1명이 PWA로 쓰는 웹 빌드를 GitHub Pages에 배포한다. (06-DEPLOYMENT.md §3-C)
# 안드로이드 5명은 기존대로 APK + eas-update.yml(OTA)를 쓰며, 이 워크플로와 무관하다.
#
# 필요한 것:
#   - Secrets: EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY
#     (anon 키는 어차피 브라우저 번들에 실린다 — 저장소 소스에 커밋하지 않으려는 목적)
#   - Settings > Pages > Source = "GitHub Actions"
#
# 서브셋 폰트(public/fonts/*.woff2)는 저장소에 커밋되어 있다.
# 폰트를 바꾸면 `npm run fonts:web`을 다시 돌려 결과를 커밋할 것.

on:
  push:
    branches: [feat/pwa-web]
    paths:
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'scripts/finalize-web-build.mjs'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 동시에 하나만. 진행 중인 건 취소하지 않는다(배포 중단 방지).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase 환경변수 시크릿이 없습니다. EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY를 등록하세요."
            exit 1
          fi
          # 로그인 화면 하단에 표시할 배포일 (네이티브의 Updates.createdAt 대응)
          export EXPO_PUBLIC_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm run build:web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
